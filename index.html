<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Finance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Home<span>Finance</span></div>
    <nav>
      <button class="nav active" data-view="dashboard">Dashboard</button>
      <button class="nav" data-view="transactions">Transactions</button>
      <button class="nav" data-view="review">Review</button>
      <button class="nav" data-view="bills">Bills</button>
      <button class="nav" data-view="budgets">Budgets</button>
      <button class="nav" data-view="debts">Debts</button>
      <button class="nav" data-view="documents">Documents</button>
    </nav>
    <div class="privacy">
      <strong>Private by design</strong>
      <span>No bank connections</span>
      <span>No money movement</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <p id="page-subtitle">Your household financial overview</p>
      </div>
      <button class="primary" id="quick-add">+ Add transaction</button>
    </header>

    <section id="app"></section>
  </main>

  <div class="modal hidden" id="transaction-modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Add transaction</h2>
        <button class="icon" id="close-modal">×</button>
      </div>
      <form id="transaction-form">
        <label>Description<input name="description" required placeholder="e.g. Costco"></label>
        <div class="grid-2">
          <label>Amount<input name="amount" type="number" step="0.01" required></label>
          <label>Date<input name="date" type="date" required></label>
        </div>
        <div class="grid-2">
          <label>Category
            <select name="category">
              <option>Housing</option><option>Utilities</option><option>Groceries</option>
              <option>Restaurants</option><option>Transportation</option><option>Insurance</option>
              <option>Subscriptions</option><option>Shopping</option><option>Healthcare</option>
              <option>Debt Payment</option><option>Other</option>
            </select>
          </label>
          <label>Type
            <select name="type">
              <option>Expense</option><option>Income</option><option>Transfer</option><option>Debt Payment</option>
            </select>
          </label>
        </div>
        <button class="primary full" type="submit">Save transaction</button>
      </form>
    </div>
  </div>

  <input id="pdf-input" type="file" accept="application/pdf" hidden />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
